<!doctype html>
<html><head><meta charset="utf-8"><title>NEON RAIN cast turntable (game look)</title>
<style>html,body{margin:0;background:#050506;overflow:hidden}canvas{display:block}</style></head>
<body>
<script src="../src/vendor/three.global.js"></script>
<script>window.NR = { ASSET: '../assets/' };</script>
<script src="../src/cast.js"></script>
<script>
// Turntables in the game's real-time look: the cast's PBR + rim materials, sodium key / neon teal rim / red fill,
// rendered to a target and finished with a port of the game's NOIR COLOR grade (ACES, warm + teal kept, cool greys,
// deep blacks, vignette, grain). window.shot(variant, opts) renders one 390x844 frame.
const T = THREE, W = 390, H = 844;
const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const rt = new T.WebGLRenderTarget(W, H, { type: T.HalfFloatType, samples: 4 });
const scene = new T.Scene(); scene.background = new T.Color(0x07070a); scene.fog = new T.FogExp2(0x0a090c, 0.05);
const cam = new T.PerspectiveCamera(32, W / H, 0.02, 60);
scene.add(new T.HemisphereLight(0x2a3444, 0x1c120c, 1.4)); const softFill = new T.PointLight(0xe8eeff, 5, 6, 1.2); softFill.position.set(1.4, 1.7, 2.4); scene.add(softFill);
const key = new T.SpotLight(0xfff0e4, 18, 14, 0.8, 1.0, 1.5); key.position.set(-1.6, 3.6, 2.6); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; scene.add(key, key.target);
const rim = new T.SpotLight(0x3fd2ff, 34, 12, 0.7, 0.6, 1.5); rim.position.set(2.2, 2.0, -2.6); scene.add(rim, rim.target);
const rim2 = new T.SpotLight(0x46c8ff, 30, 12, 0.7, 0.6, 1.5); rim2.position.set(-2.4, 2.2, -2.2); scene.add(rim2, rim2.target);
const fill = new T.PointLight(0xff3050, 3, 8, 1.6); fill.position.set(2.2, 0.9, 2.2); scene.add(fill);
const sodium = new T.SpotLight(0xffa860, 12, 12, 0.6, 0.7, 1.5); sodium.position.set(2.8, 3.2, 1.2); scene.add(sodium, sodium.target);
const floor = new T.Mesh(new T.CircleGeometry(6, 64), new T.MeshStandardMaterial({ color: 0x100e0d, roughness: 0.6, metalness: 0.0 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const wall = new T.Mesh(new T.PlaneGeometry(14, 8), new T.MeshStandardMaterial({ color: 0x1b1714, roughness: 0.9 })); wall.position.set(0, 4, -4); wall.receiveShadow = true; scene.add(wall);
// the game's post grade (NOIR COLOR) on a full-screen quad
const post = new T.ShaderMaterial({ uniforms: { tCol: { value: rt.texture }, expo: { value: 1.0 }, time: { value: 0.3 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `uniform sampler2D tCol; uniform float expo, time; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
    void main(){ vec3 col = texture2D(tCol, vUv).rgb;
      col = aces(col * expo); col = pow(col, vec3(1./2.2));
      float l = dot(col, vec3(0.299,0.587,0.114)); float mx=max(col.r,max(col.g,col.b)), mn=min(col.r,min(col.g,col.b)); float sat=(mx-mn)/(mx+1e-4);
      float red = smoothstep(0.28,0.5,sat)*smoothstep(0.02,0.1,col.r-max(col.g,col.b))*smoothstep(0.42,0.3,col.g/(col.r+1e-3));
      float hr = col.r - col.b, hg = col.g - col.r;
      float warm = smoothstep(0.06, 0.2, hr) * smoothstep(0.22, 0.45, sat) * smoothstep(0.05, 0.22, mx);
      float teal = smoothstep(0.03, 0.12, hg + (col.b - col.r) * 0.5) * smoothstep(0.25, 0.45, sat) * smoothstep(0.25, 0.5, mx);
      float keep = clamp(max(max(warm, teal), red * smoothstep(0.03, 0.12, mx)), 0.0, 1.0);
      vec3 grey = vec3(l) * mix(vec3(0.86, 0.95, 1.1), vec3(1.0, 0.98, 0.95), smoothstep(0.05, 0.6, l));
      vec3 vivid = mix(vec3(l), col, 1.25);
      col = mix(grey, vivid, keep * 0.92); col = max(col, 0.0);
      col = smoothstep(vec3(0.035), vec3(1.0), col);
      vec2 q = vUv-0.5; float r2 = dot(q*vec2(1.0,0.75), q*vec2(1.0,0.75)); col *= 1.0 - r2*1.35;
      float gr = h(gl_FragCoord.xy*0.73 + time*100.) - 0.5; col += gr*0.035*(0.3+0.7*(1.-l));
      gl_FragColor = vec4(col, 1.0); }` });
const pScene = new T.Scene(), pCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1); pScene.add(new T.Mesh(new T.PlaneGeometry(2, 2), post));
let cur = []; const tpls = {};
window.READY = false;
Promise.allSettled(Object.keys(NR.cast.URL).map(f => NR.cast.family(NR.ASSET + NR.cast.URL[f]).then(t => { tpls[f] = t; }))).then(() => { window.READY = true; window.HAVE = Object.keys(tpls); });
function rig(variant, clip, t, x, ang) {
  const r = new NR.cast.Rig(tpls[NR.cast.FAMILY[variant]], variant);
  r.full(clip || 'idle', 0, false); r.mixer.setTime(t || 0.5); r.root.position.x = x || 0; r.root.rotation.y = (ang || 0) * Math.PI / 180;
  scene.add(r.root); r.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); r.root.updateMatrixWorld(true); cur.push(r); return r;
}
function clear() { for (const r of cur) scene.remove(r.root); cur = []; }
function draw() { renderer.setRenderTarget(rt); renderer.render(scene, cam); renderer.setRenderTarget(null); renderer.render(pScene, pCam); }
window.shot = (variant, o) => {
  clear(); o = o || {};
  const r = rig(variant, o.clip, o.t, 0, o.ang);
  const head = r.bones.head.getWorldPosition(new T.Vector3());
  if (o.face) { // frame the face from the eyes' height, square on to the body's facing turned by ang
    r.root.updateMatrixWorld(true); const yaw = r.root.rotation.y, fw = new T.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    const hp = r.nodes.spine_006.getWorldPosition(new T.Vector3()), nk = r.nodes.spine_005.getWorldPosition(new T.Vector3());
    const up = hp.clone().sub(nk).normalize(); const tgt = hp.clone().addScaledVector(up, 0.075).addScaledVector(fw, 0.06);
    cam.fov = 13; cam.position.copy(tgt).addScaledVector(fw, 1.05).add(new T.Vector3(0, 0.01, 0)); cam.lookAt(tgt); }
  else if (o.fp) { // first person: over the shoulder of the gun hand
    if (r.hat) r.hat.visible = false; r.nodes.spine_006.scale.setScalar(0.001);
    const eye = head.clone().add(new T.Vector3(0, 0.12, 0.10)); cam.fov = 60; cam.position.copy(eye);
    const hand = r.bones.handR.getWorldPosition(new T.Vector3()); cam.lookAt(hand.x * 0.6, hand.y - 0.05, hand.z + 1.6);
  }
  else { cam.fov = 32; cam.position.set(0, 1.0, 4.6); cam.lookAt(0, 0.95, 0); }
  cam.aspect = W / H; cam.updateProjectionMatrix(); key.target.position.set(0, 1, 0); rim.target.position.set(0, 1.3, 0); rim2.target.position.set(0, 1.3, 0); sodium.target.position.set(0, 1.2, 0);
  draw(); return true;
};
window.lineup = (list) => {
  clear(); const n = list.length;
  list.forEach(([v, clip, t], i) => rig(v, clip, t, (i - (n - 1) / 2) * 0.78, 0));
  renderer.setSize(1560, 844); rt.setSize(1560, 844); cam.aspect = 1560 / 844; cam.fov = 30;
  cam.position.set(0, 1.15, 10.5); cam.lookAt(0, 0.95, 0); cam.updateProjectionMatrix();
  key.position.set(-3, 4.5, 4.5); key.angle = 0.9; key.intensity = 120; rim.position.set(3, 4, -3.5); rim.angle = 1.0; rim.intensity = 150; rim2.position.set(-4, 4, -3); rim2.angle = 1.0; rim2.intensity = 90; sodium.position.set(5, 4, 2); sodium.angle = 1.0; sodium.intensity = 70;
  draw(); return true;
};
</script>
</body></html>
